<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TRENA">
  <title>TRENA</title>
  <link rel="icon" href="/trena-logo.jpg">
  <link rel="apple-touch-icon" href="/trena-logo.jpg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      const t = localStorage.getItem('trena-theme');
      const light = t === 'light';
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f6f6f4' : '#0f0f0f');
    })();
  </script>
</head>
<body>
  <div id="splash" class="splash">
    <img src="/trena-emblem.jpg" alt="TRENA. Тренируйся, развивайся, достигай">
  </div>
  <script>document.getElementById('splash').dataset.t = String(Date.now());</script>
  <div id="app" class="app-shell"></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
